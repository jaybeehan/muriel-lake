name: Probe data sources (temporary)

on:
  push:
    paths: [".github/workflows/probe.yml"]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: CORS headers
        run: |
          exec > >(tee -a /tmp/probe.txt) 2>&1
          for u in \
            "https://api.weather.gc.ca/collections/hydrometric-daily-mean/items?STATION_NUMBER=05FA013&f=csv&limit=3&properties=DATE,LEVEL&sortby=-DATE" \
            "https://api.weather.gc.ca/collections/hydrometric-daily-mean/items?STATION_NUMBER=05FA013&f=json&limit=2&properties=DATE,LEVEL&skipGeometry=true&sortby=-DATE" \
            "https://api.weather.gc.ca/collections/hydrometric-realtime/items?STATION_NUMBER=05FA013&f=csv&limit=3&properties=DATETIME,LEVEL&sortby=DATETIME" \
            "https://api.weather.gc.ca/collections/hydrometric-realtime/items?STATION_NUMBER=05FA013&f=json&limit=1&resulttype=hits" \
            "https://api.weather.gc.ca/collections/hydrometric-stations/items?f=csv&limit=2&properties=STATION_NUMBER,STATION_NAME,PROV_TERR_STATE_LOC,STATUS_EN,REAL_TIME" ; do
          done
      - name: Save results to branch probe-output
        run: |
          mkdir out && cd out && git init -q -b probe-output && cp /tmp/probe.txt .
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add . && git commit -qm "probe results"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe-output
