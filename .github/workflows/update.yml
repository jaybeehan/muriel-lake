name: Update data and publish

on:
  schedule:
    - cron: "17 13 * * 1"   # every Monday, about 7 a.m. Alberta time
  workflow_dispatch:         # "Run workflow" button on the Actions tab
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Excel library
        run: pip install openpyxl

      - name: Download and process water level data
        run: python scripts/build_data.py

      - name: Save updated data to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/lake.json
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Update water level data $(date -u +%Y-%m-%d)"
            git pull --rebase -X theirs origin main
            git push origin HEAD:main
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
